# Runs utilities/check_all.mjs on GitHub's machines, so the suite need not run
# on the maintainer's 8 GB Mac before every push. It builds and deploys
# nothing: Pages still serves the branch exactly as committed.
#
# What it cannot have, it skips, and a skip reads like a clean result, so the
# table's skips are worth reading: the game is fetched from archive.org
# (fetch_game.mjs), but the community add-ons, the playthrough kit, the
# registered licence and the workbench's symbol list are in no public
# repository. The forks are checked out beside this repository, where
# check_all.mjs looks for them.

name: checks

on:
  push:
    branches: [main, 'front/**']
  workflow_dispatch:

jobs:
  # The suite runs as four shares on four machines at the same time, which
  # cut a run from about six minutes to the longest check plus the setup
  # (check_all.mjs, CHECK_SHARD and check_weights.json). A share that fails
  # leaves the others running, so one run reports every failure.
  check_all:
    name: check_all (share ${{ matrix.share }} of 4)
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@v5
        with:
          path: grimoire
          submodules: true
          fetch-depth: 0   # version_check.mjs compares against origin/main

      - uses: actions/checkout@v5
        with:
          repository: ratlizard/wolflizard
          ref: cythera-detailed
          path: wolflizard

      # A front that changes a mac-files reader copies it into js/ before
      # mac-files' main has it, since mac-files lands a change only once these
      # checks pass with the copy (its README). So a front's run checks out
      # mac-files' branch of the same name when there is one, which
      # tools/front.sh land pushes before it waits for this run, and every
      # other run mac-files' main.
      - name: Choose the mac-files branch
        id: macfiles
        run: |
          ref=""
          if [[ "$GITHUB_REF_NAME" == front/* ]] &&
             git ls-remote --exit-code --heads https://github.com/ratlizard/mac-files "$GITHUB_REF_NAME" >/dev/null; then
            ref="$GITHUB_REF_NAME"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "mac-files at ${ref:-main}"

      - uses: actions/checkout@v5
        with:
          repository: ratlizard/mac-files
          ref: ${{ steps.macfiles.outputs.ref }}
          path: mac-files

      # The player calls functions nothing in grimoire does (reach_check.mjs).
      - uses: actions/checkout@v5
        with:
          repository: ratlizard/ratlizard.github.io
          path: ratlizard.github.io

      - uses: actions/setup-node@v5
        with:
          node-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wolflizard

      # ppc_check.mjs needs llvm-mc 22 or later (21 reads the code section
      # differently); Ubuntu's own llvm is older, so apt.llvm.org's.
      - name: Tools the checks compare against
        run: |
          sudo apt-get update && sudo apt-get install -y unar
          wget -q https://apt.llvm.org/llvm.sh && sudo bash llvm.sh 22
          echo "LLVM_MC=$(command -v llvm-mc-22)" >> "$GITHUB_ENV"

      # The installer fetch_game.mjs downloads and the art pack, kept between runs.
      - uses: actions/cache@v5
        with:
          path: tmp
          key: grimoire-inputs-v1

      # The table gives one line per check; after a failure each failed check
      # is run again on its own, which prints its whole output to the log.
      # The page looks for the installer under reference/ before archive.org,
      # and every miss is a 404 in the console, which browser_check.mjs fails
      # on. Putting the downloaded archive where the page looks first is what a
      # local checkout with the game has.
      - name: The installer, where the page looks first
        working-directory: grimoire
        run: |
          mkdir -p "$TMPDIR" reference/game/installers
          node utilities/fetch_game.mjs "$TMPDIR"
          cp "$TMPDIR/Cythera installers (archive.org).sit" reference/game/installers/

      - name: check_all
        working-directory: grimoire
        shell: bash
        run: |
          set +e
          CHECK_SHARD=${{ matrix.share }}/4 node utilities/check_all.mjs | tee "$TMPDIR/table.txt"
          status=${PIPESTATUS[0]}
          grep -E '^  FAIL  ' "$TMPDIR/table.txt" | sed -E 's/^  FAIL  (.*)  \([0-9.]+s\)$/\1/' | while read -r name; do
            echo "::group::$name, run alone"
            CHECK_SHARD= node utilities/check_all.mjs "$name" | tail -80
            echo "::endgroup::"
          done
          exit $status
